    <script>
      // Apply the stored locale and theme before React mounts, so the first
      // paint does not flash the wrong language or a light background.
      (function () {
        try {
          var locale = window.localStorage.getItem("locale");
          if (locale === "zh") {
            document.documentElement.lang = "zh-CN";
          }
          var theme = window.localStorage.getItem("theme");
          if (theme !== "light") {
            document.documentElement.style.backgroundColor = "#07111d";
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (error) {
          // localStorage can be unavailable (private mode); keep the defaults.
        }
      })();
    </script>

    <noscript><main><h1>Highlights</h1><p>This page collects representative outcomes across research, engineering, open-source contribution, and public knowledge curation. Research and Evaluation Highlights - MME related work: Xu Lin is listed among the authors of the MME benchmark, making multimodal evaluation one of the clearest paper-related signals in the public profile - YOLO-Master direction: current public material shows an active detection line connected to YOLO-style architectures and efficiency-oriented design - Public resume material also points to work on multimodal evaluation, large-scale image-text data construction, and practical recall optimization Open-Source and Engineering Highlights - LlamaFactory: a visible fork-based contribution direction in efficient fine-tuning, LLM, and VLM engineering - paper-list: a visible public repository combining paper collection, automation, and open publishing workflow - crablet: practical AI assistant and agentic system building - YOLOv8 Efficient: long-running practical computer vision engineering work - Agent-oriented repositories such as darwin-agent and eval-skills show a clear current shift toward agent systems Public Curation and Knowledge Impact - paper-list: a flagship paper curation and update system - awesome-road-map: structured roadmap-oriented public curation - awesome-foundation-agents: foundation-agent oriented awesome-style collection - VALSE-WorkShop: a long-running public aggregation of workshop and resource material - paper-read-notes, Stanford-CS-Course, and prompt-engineering-note show a sustained habit of learning in public and turning study into reusable public assets Why These Highlights Matter Taken together, these highlights show a profile that is not limited to a single paper, repository, or benchmark. A recurring pattern is the ability to connect: - research with evaluation - evaluation with deployment - deployment with reusable engineering - engineering with public documentation and open curation That combination is one of the clearest patterns in the portfolio.</p></main></noscript>
