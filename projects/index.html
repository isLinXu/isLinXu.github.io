    <script>
      // Apply the stored locale and theme before React mounts, so the first
      // paint does not flash the wrong language or a light background.
      (function () {
        try {
          var locale = window.localStorage.getItem("locale");
          if (locale === "zh") {
            document.documentElement.lang = "zh-CN";
          }
          var theme = window.localStorage.getItem("theme");
          if (theme !== "light") {
            document.documentElement.style.backgroundColor = "#07111d";
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (error) {
          // localStorage can be unavailable (private mode); keep the defaults.
        }
      })();
    </script>

    <noscript><main><h1>Projects</h1><p>This page mirrors the public repository list on GitHub. It includes both self-owned repositories and contribution-oriented repositories that help explain the current public profile. Core Representative Repositories - paper-list: a public paper-tracking and publishing workflow centered on collection, organization, and regular updates - crablet: a self-owned AI assistant repository that reflects current interest in agentic workflows and practical tooling - claude-code-book: a self-owned repository focused on coding-agent workflows, notes, and related engineering material - darwin-agent: a self-owned repository aligned with current interest in agent systems - eval-skills: a self-owned evaluation-oriented repository related to skills, checks, and quality validation - YOLOv8 Efficient: a self-owned computer vision repository focused on practical YOLOv8 training and evaluation workflows - isLinXu.github.io: the portfolio site itself Contribution and Collaboration Direction These items are included because they help explain the current technical direction, even when the public repository is fork-based. - YOLO-Master: a public fork-based working repository connected to the YOLO-Master detection direction - LlamaFactory: a public fork-based contribution direction related to LLM and VLM fine-tuning engineering - MME related work: Xu Lin is listed among the authors of the MME benchmark, making multimodal evaluation a verifiable part of the public profile - claude-code: a public fork-based build-and-run branch around Claude Code related engineering - claude-code-src: a public fork-based repository used to track source-oriented Claude Code work - ms-agent: a public fork-based agent framework direction - MobileAgent: a public fork-based repository tied to GUI and mobile agent exploration - mcore-bridge: a public fork-based direction related to large-model infrastructure and Megatron-Core work Public Curation and Learning Repositories - paper-list: a visible paper curation project that combines collection, filtering, and publishing workflow - awesome-road-map: a structured public roadmap and learning archive - awesome-foundation-agents: an awesome-style collection related to foundation agents - VALSE-WorkShop: a long-running workshop and resource aggregation project - paper-read-notes: public research reading notes - Stanford-CS-Course: a curated course-resource archive - prompt-engineering-note: a public prompt engineering note collection Project Pattern Taken together, the visible repositories show several recurring themes: - multimodal AI, LLM, and agent-related workflows - practical engineering and developer tooling - model evaluation, skills, and automation experiments - computer vision and YOLO-related applied work - benchmark and evaluation-oriented thinking - public curation, paper collection, and open learning archives Source - GitHub repositories: github.com/isLinXu?tab=repositories</p></main></noscript>
